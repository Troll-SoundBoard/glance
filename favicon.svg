<svg xmlns="http://w3.org" viewBox="0 0 100 100">
  <defs>
    <!-- Smooth rounded square clipping path -->
    <clipPath id="squircle">
      <rect width="100" height="100" rx="20" ry="20" />
    </clipPath>
  </defs>
  <!-- Links directly to your root image file -->
  <image href="favicon.jpeg" width="100" height="100" clip-path="url(#squircle)" />
</svg>
